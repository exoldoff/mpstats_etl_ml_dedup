<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ML-дедуп MPStats: от embeddings до вывода</title>
  <desc id="desc">Цветная блок-схема ML-этапов дедупликации SKU: embeddings, FAISS, пары-кандидаты, BGE scoring, threshold, graph grouping и dedup output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf1"/>
      <stop offset="52%" stop-color="#f3fbff"/>
      <stop offset="100%" stop-color="#f8f3ff"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9f8f4"/>
      <stop offset="45%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#fff2da"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-16%" width="120%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#162033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#344761"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#168a7b"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
        fill: #202938;
      }
      .title { font-size: 36px; font-weight: 850; }
      .subtitle { font-size: 18px; fill: #59677a; }
      .card-title { font-size: 17px; font-weight: 850; }
      .line { font-size: 14px; fill: #3e4b5e; }
      .small { font-size: 12px; fill: #617084; }
      .num { font-size: 13px; font-weight: 850; fill: #ffffff; }
      .chip { font-size: 13px; font-weight: 780; fill: #2b384a; }
      .arrow { fill: none; stroke: #344761; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-fill { fill: #344761; }
      .cache-arrow { fill: none; stroke: #168a7b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="52" y="66" class="title">ML-дедуп: от embeddings до dedup output</text>
  <text x="54" y="98" class="subtitle">Узкая модельная линия: векторы SKU -> похожие пары -> score -> порог -> граф групп -> вывод.</text>

  <g transform="translate(52 126)">
    <rect x="0" y="0" width="1096" height="74" rx="8" fill="#ffffff" stroke="#cfd9e8"/>
    <text x="24" y="30" class="card-title">Вход уже подготовлен</text>
    <text x="24" y="55" class="line">SKU-node text: название + бренд + вес/фасовка; node id: marketplace + Артикул; строки с малым объёмом продаж уже отсечены.</text>
  </g>

  <g transform="translate(52 232)">
    <rect x="0" y="0" width="1096" height="260" rx="8" fill="url(#rail)" stroke="#cad8e8" stroke-width="2"/>

    <g filter="url(#shadow)">
      <rect x="24" y="54" width="154" height="146" rx="8" fill="#ffffff" stroke="#2fa99a" stroke-width="3"/>
      <circle cx="48" cy="79" r="15" fill="#1f9d89"/>
      <text x="43" y="84" class="num">1</text>
      <text x="74" y="80" class="card-title">Embeddings</text>
      <text x="48" y="115" class="line">E5 model</text>
      <text x="48" y="139" class="line">SKU -> vector</text>
      <text x="48" y="163" class="line">normalize</text>
      <text x="48" y="187" class="small">embedding cache</text>

      <rect x="208" y="54" width="154" height="146" rx="8" fill="#ffffff" stroke="#4d8ce8" stroke-width="3"/>
      <circle cx="232" cy="79" r="15" fill="#3667d6"/>
      <text x="227" y="84" class="num">2</text>
      <text x="258" y="80" class="card-title">FAISS</text>
      <text x="232" y="115" class="line">IndexFlatIP</text>
      <text x="232" y="139" class="line">top_k = 30</text>
      <text x="232" y="163" class="line">nearest SKU</text>
      <text x="232" y="187" class="small">fast retrieval</text>

      <rect x="392" y="54" width="154" height="146" rx="8" fill="#ffffff" stroke="#e3a72c" stroke-width="3"/>
      <circle cx="416" cy="79" r="15" fill="#ef9f2f"/>
      <text x="411" y="84" class="num">3</text>
      <text x="442" y="80" class="card-title">Pairs</text>
      <text x="416" y="115" class="line">A-B candidates</text>
      <text x="416" y="139" class="line">no full scan</text>
      <text x="416" y="163" class="line">pair key</text>
      <text x="416" y="187" class="small">not a decision yet</text>

      <rect x="576" y="54" width="154" height="146" rx="8" fill="#ffffff" stroke="#9b72d8" stroke-width="3"/>
      <circle cx="600" cy="79" r="15" fill="#7c5ca8"/>
      <text x="595" y="84" class="num">4</text>
      <text x="626" y="80" class="card-title">BGE score</text>
      <text x="600" y="115" class="line">cross-encoder</text>
      <text x="600" y="139" class="line">pair score</text>
      <text x="600" y="163" class="line">sigmoid</text>
      <text x="600" y="187" class="small">ft_bge_reranker</text>

      <rect x="760" y="54" width="154" height="146" rx="8" fill="#ffffff" stroke="#e86e56" stroke-width="3"/>
      <circle cx="784" cy="79" r="15" fill="#e76f51"/>
      <text x="779" y="84" class="num">5</text>
      <text x="810" y="80" class="card-title">Порог</text>
      <text x="784" y="115" class="line">weighted-cost</text>
      <text x="784" y="139" class="line">category threshold</text>
      <text x="784" y="163" class="line">same / different</text>
      <text x="784" y="187" class="small">0.917 / 0.872 / 0.930</text>

      <rect x="944" y="54" width="128" height="146" rx="8" fill="#ffffff" stroke="#2fa99a" stroke-width="3"/>
      <circle cx="968" cy="79" r="15" fill="#1f9d89"/>
      <text x="963" y="84" class="num">6</text>
      <text x="994" y="80" class="card-title">Группы</text>
      <text x="968" y="115" class="line">positive graph</text>
      <text x="968" y="139" class="line">family</text>
      <text x="968" y="163" class="line">pack split</text>
      <text x="968" y="187" class="small">family -> pack</text>
    </g>

    <g class="arrow-fill">
      <rect x="178" y="125" width="13" height="4" rx="2"/>
      <path d="M 190 114 L 207 127 L 190 140 Z"/>
      <rect x="362" y="125" width="13" height="4" rx="2"/>
      <path d="M 374 114 L 391 127 L 374 140 Z"/>
      <rect x="546" y="125" width="13" height="4" rx="2"/>
      <path d="M 558 114 L 575 127 L 558 140 Z"/>
      <rect x="730" y="125" width="13" height="4" rx="2"/>
      <path d="M 742 114 L 759 127 L 742 140 Z"/>
      <rect x="914" y="125" width="13" height="4" rx="2"/>
      <path d="M 926 114 L 943 127 L 926 140 Z"/>
    </g>

    <text x="24" y="231" class="line">FAISS даёт короткий candidate pool, BGE решает вероятность дубля, threshold превращает score в ребро графа.</text>
  </g>

  <path class="arrow" d="M 1060 432 C 1088 504, 1030 526, 968 552"/>

  <g transform="translate(52 536)">
    <rect x="0" y="0" width="512" height="142" rx="8" fill="#ffffff" stroke="#d3deeb"/>
    <text x="24" y="34" class="card-title">Кэш ускоряет повторные запуски</text>
    <text x="24" y="65" class="line">identity-cache: node уже знает ML-группу</text>
    <text x="24" y="91" class="line">embedding-cache: vector не считается повторно</text>
    <text x="24" y="117" class="line">pair score-cache: BGE не скорит ту же пару снова</text>
    <path class="cache-arrow" d="M 365 -44 C 260 -80, 130 -74, 92 -52"/>
    <path class="cache-arrow" d="M 488 -35 C 556 -75, 705 -74, 730 -52"/>
  </g>

  <g transform="translate(616 536)">
    <rect x="0" y="0" width="532" height="142" rx="8" fill="#ffffff" stroke="#d3deeb"/>
    <text x="24" y="34" class="card-title">Вывод дедупа</text>
    <rect x="24" y="56" width="116" height="34" rx="8" fill="#eef3ff" stroke="#9eb9f2"/>
    <text x="39" y="78" class="chip">nodes</text>
    <rect x="152" y="56" width="116" height="34" rx="8" fill="#f1edff" stroke="#baa3e8"/>
    <text x="167" y="78" class="chip">edges</text>
    <rect x="280" y="56" width="116" height="34" rx="8" fill="#e7f6f2" stroke="#79c8bb"/>
    <text x="295" y="78" class="chip">groups</text>
    <rect x="408" y="56" width="96" height="34" rx="8" fill="#fff1d7" stroke="#e5b75a"/>
    <text x="424" y="78" class="chip">browser</text>
    <text x="24" y="116" class="line">`dedup_*` таблицы + `mpstats_products_dedup` для UI и CSV-выгрузок.</text>
  </g>

  <text x="52" y="724" class="small">Production profile: intfloat/multilingual-e5-small -> FAISS top_k=30 -> fine-tuned BGE -> threshold_weighted_cost -> category thresholds for sauces / coconut_oil / soap.</text>
</svg>
