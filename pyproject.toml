[project]
name = "mpstats-local-app"
version = "0.1.0"
description = "Local web app for MPStats exports, normalization, classification, and reports."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30,<2",
    "datasets>=2.20,<5",
    "duckdb>=1.0,<2",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "fsspec>=2023.1,<2026.3",
    "huggingface-hub>=0.20,<1",
    "httpx>=0.27,<1",
    "igraph>=0.11,<2",
    "ipykernel>=6.29,<7",
    "ipython>=8.20,<9",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.2,<5",
    "leidenalg>=0.10,<1",
    "libpff-python>=20231205",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "numpy>=1.24,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
    "peft>=0.11,<1",
    "plotly>=5.22,<7",
    "pydantic>=2.7,<3",
    "pytest>=8.0,<9",
    "python-telegram-bot>=22.5,<23",
    "rapidfuzz>=3.9,<4",
    "requests>=2.31,<3",
    "seaborn>=0.13,<1",
    "sentence-transformers>=5.0,<6",
    "starlette>=0.40,<1",
    "torch>=2.3,<3",
    "transformers>=4.51,<5",
    "uvicorn[standard]>=0.30,<1",
    "wcwidth>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
