[project]
name = "mpstats-local-app"
version = "0.1.0"
description = "Local web app for MPStats exports, normalization, classification, and reports."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0,<2",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.115,<1",
    "igraph>=0.11,<2",
    "leidenalg>=0.10,<1",
    "matplotlib>=3.8,<4",
    "numpy>=1.24,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
    "requests>=2.31,<3",
    "seaborn>=0.13,<1",
    "sentence-transformers>=5.0,<6",
    "torch>=2.3,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
